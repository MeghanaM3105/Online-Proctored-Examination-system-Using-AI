<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ProctorExam.AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='forgot_password.css') }}">
</head>
<body>

    <!-- Consistent Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
                <i class="fa-solid fa-graduation-cap me-2 text-primary"></i>
                ProctorExam<span class="text-primary">.AI</span>
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('register') }}">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container d-flex flex-column justify-content-center min-vh-100 py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <i class="fa-solid fa-key text-primary" style="font-size: 3rem;"></i>
                            <h3 class="fw-bold mt-2">Forgot Password</h3>
                            <p class="text-muted small">Reset your password with OTP</p>
                        </div>

                        <form id="forgotPasswordForm">
                            <div class="mb-3">
                                <label class="form-label text-muted">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-secondary"></i></span>
                                    <input type="email" id="fpEmail" class="form-control border-start-0" placeholder="name@example.com" required>
                                </div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="button" class="btn btn-outline-primary py-2 fw-bold" id="sendOtpBtn">
                                    <i class="fa-solid fa-paper-plane me-2"></i>Send OTP
                                </button>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted">OTP</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-shield-halved text-secondary"></i></span>
                                    <input type="text" id="fpOtp" class="form-control border-start-0" placeholder="6-digit OTP" inputmode="numeric" autocomplete="one-time-code" disabled>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted">New Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-secondary"></i></span>
                                    <input type="password" id="fpNewPassword" class="form-control border-start-0" placeholder="New password" disabled>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-muted">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-secondary"></i></span>
                                    <input type="password" id="fpConfirmPassword" class="form-control border-start-0" placeholder="Confirm password" disabled>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3 py-2 fw-bold" id="resetPasswordBtn" disabled>
                                Reset Password
                            </button>

                            <div class="text-center">
                                <a href="{{ url_for('login') }}" class="text-decoration-none small text-muted">Back to Login</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>
</body>
</html>
