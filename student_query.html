<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Queries - Admin Panel</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='student_query.css') }}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark fixed-top px-3 shadow">
        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
            <i class="fa-solid fa-shield-halved text-danger me-2"></i>Admin<span class="text-light">Portal</span>
        </a>
        <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-sm">Logout</a>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar">
        <h6 class="text-uppercase text-muted small fw-bold px-4 mb-3 mt-3">Main Menu</h6>
        <a href="{{ url_for('admin_dashboard') }}"><i class="fa-solid fa-chart-line me-2"></i> Dashboard</a>
        <a href="{{ url_for('student_details') }}"><i class="fa-solid fa-users me-2"></i> Students</a>
        <a href="{{ url_for('create_exam') }}"><i class="fa-solid fa-file-pen me-2"></i> Exams</a>
        <a href="#" class="active"><i class="fa-solid fa-envelope-open-text me-2"></i> Student Queries</a>
 
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-0">Student Queries</h2>
                <p class="text-muted mb-0">View and manage messages submitted from the Contact form</p>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">Messages</h5>
                <input type="text" class="form-control form-control-sm" id="querySearch" placeholder="Search name or email..." style="max-width: 260px;">
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Status</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Message</th>
                                <th>Date</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody id="studentQueryTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- View Modal -->
    <div class="modal fade" id="queryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Query Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2"><span class="fw-bold">Name:</span> <span id="modalQueryName">--</span></div>
                    <div class="mb-2"><span class="fw-bold">Email:</span> <span id="modalQueryEmail">--</span></div>
                    <div class="mb-3"><span class="fw-bold">Date:</span> <span id="modalQueryDate">--</span></div>
                    <div class="fw-bold mb-2">Message</div>
                    <div class="border rounded p-3 bg-light" style="white-space: pre-wrap;" id="modalQueryMessage">--</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/student_query.js') }}"></script>
</body>
</html>
